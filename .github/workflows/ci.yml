name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full]" pytest
      - name: unit tests
        run: pytest tests/ -q
      - name: the CLI entry point exists and answers
        run: |
          ownbaseline floors --list-grid
          ownbaseline floors --n 39505 --rho 0.4844 | grep -- '+0.0247'
      - name: published floors come back out of the shipped grid
        run: pytest tests/test_cli.py -q -k floor
      - name: self-test
        run: python reproduce.py --self-test
