name: release

# Publishes to PyPI when a tag like v0.2.0 is pushed.
#
# No API token lives in this repository. PyPI Trusted Publishing signs the
# upload with this workflow's own OIDC identity, which has to be registered once
# on PyPI before the first tag: pypi.org -> Your projects -> Publishing ->
# Add a new pending publisher, with
#   PyPI project name  own-baseline
#   Owner              IskakovDamir
#   Repository         ownbaseline
#   Workflow           release.yml
#   Environment        pypi
# and a GitHub environment of the same name under Settings -> Environments.
# Until both exist the publish step fails and nothing else does.
#
# One job on purpose. Handing the artefacts between jobs needs upload-artifact
# and download-artifact, whose major versions move faster than this repository
# does, and a release that fails on an action version is worse than a release
# that takes thirty seconds longer. The action versions here are the ones the
# test workflow already runs green on.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing needs this and nothing else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: the version in pyproject must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag $TAG, pyproject $VER"
          test "$TAG" = "$VER"

      - name: build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: the wheel must carry the null grid, and PyPI must accept the metadata
        run: |
          python tools/check_wheel.py dist/*.whl
          twine check dist/*

      - name: install the wheel clean and make it answer
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          /tmp/v/bin/ownbaseline --version
          /tmp/v/bin/ownbaseline floors --n 39505 --rho 0.4844 | grep -- '+0.0247'

      - uses: pypa/gh-action-pypi-publish@release/v1
