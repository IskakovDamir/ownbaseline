name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full]" pytest
      - name: unit tests
        run: |
          set -o pipefail
          pytest tests/ -q -ra --tb=short 2>&1 | tee /tmp/pytest.txt
      - name: put the failure on the run summary, which is readable without signing in
        if: failure()
        run: |
          {
            echo "### pytest failed on Python ${{ matrix.python-version }}"
            echo '```'
            tail -n 120 /tmp/pytest.txt 2>/dev/null || echo "no pytest output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: the CLI entry point exists and answers
        run: |
          ownbaseline floors --list-grid
          ownbaseline floors --n 39505 --rho 0.4844 | grep -- '+0.0247'
      - name: published floors come back out of the shipped grid
        run: pytest tests/test_cli.py -q -k floor
      - name: self-test
        run: |
          set -o pipefail
          python reproduce.py --self-test 2>&1 | tee /tmp/selftest.txt
      - name: put the self-test failure on the run summary too
        if: failure()
        run: |
          {
            echo "### later step failed on Python ${{ matrix.python-version }}"
            echo '```'
            tail -n 80 /tmp/selftest.txt 2>/dev/null || echo "self-test produced no output, so it failed before it"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build a wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: the wheel must carry the null grid, not just the code
        run: python tools/check_wheel.py dist/*.whl
      - name: install it clean and answer a published floor
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          /tmp/v/bin/ownbaseline floors --n 39505 --rho 0.4844 | grep -- '+0.0247'
